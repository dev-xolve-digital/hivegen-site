# 08 · Book a call. Words in {curly braces} are filled in by the site; keep them as they are.
heading: Book your 15-minute call
subline: Pick a time that suits you. We'll go through your listings together, and your first edit is free.
bullets:
  - See edits made for listings like yours
  - Get an exact quote for your volume
  - Start your free first edit right away
instagramLine: Prefer to chat? Message us on Instagram
steps:
  details: Your details
  time: Pick a time
fields:
  name: Name
  email: Email
  phone: Phone or WhatsApp (optional)
  buyer: I am a…
  volume: Videos per month
  footage: Raw footage link (optional, for your free edit)
  footageHint: A Google Drive, Dropbox or WeTransfer link is fine.
buyerOptions:
  - value: agency
    label: Media agency
  - value: videographer
    label: Videographer
  - value: agent
    label: Agent
  - value: other
    label: Other
volumeOptions: ["1–5", "6–15", "16–30", "30+"]
nextLabel: "Next: pick a time"
backLabel: Back
confirmLabel: Confirm booking
consentLine: By booking, you agree to our Privacy Policy. We only use your details to arrange your call and your free edit.
timeHeading: Pick a time
timeNote: Times shown in your time zone ({timezone}).
noSlots: No times are open in the next two weeks. Message us on Instagram and we'll find one.
# Shown above the times when the calendar could not be checked. {backupLink} becomes a link to the backup appointment page
# (backupUrl in site.yaml), written with the words of backupLabel. With no backupUrl set, the link is left out.
calendarNote: We couldn't check the calendar just now, so we'll confirm your time by email. {backupLink}
backupLabel: Or pick a time on our own appointment page
# The visitor's booking is confirmed (Google made the event).
confirmation:
  heading: You're booked.
  text: We've sent a calendar invite with a Google Meet link to {email}.
  nextStepsHeading: What happens next
  nextSteps:
    - Join the call on {when}.
    - Send footage from one listing; your first edit is free.
    - Get your video in 24–48 hours.
  addToCalendar: Add to calendar
  manageLabel: Reschedule or cancel   # the link to the visitor's private booking page
  calendarTitle: 15-minute call with HiveGen   # event name used by "Add to calendar"
  instagramLabel: Chat on Instagram
# The time is held but Google could not make the event, so it is confirmed by hand. {when} and {email} are filled in.
# Never say "booked" here: the visitor has not got a calendar invite yet.
requested:
  heading: We've got your request.
  text: We're holding {when} for you. We confirm these calls by hand, so you'll get an email at {email} with your Google Meet link as soon as it's done.
# In place of the form when online booking is not available (not set up yet, or the server cannot be reached).
offline:
  heading: Booking is not available right now.
  text: Message us on Instagram and we'll find a time that suits you. Your first edit is still free.
honeypotLabel: Leave this field empty   # a hidden field that only robots fill in; people never see it
errors:
  name: Please enter your name.
  email: Please enter a valid email.
  buyer: Please choose what describes you best.
  volume: Please choose how many videos you need each month.
  phone: Please check the phone number. Use digits, spaces, + ( ) or -.
  footage: Please paste the full link, starting with https://.
  slotTaken: That time was just taken. Please pick another one.
  # [confirm: how fast Hassan replies]
  unreachable: Your details are saved. We'll confirm your time by email shortly.
  network: We couldn't send your details. Please check your connection and try again, or message us on Instagram.
  botCheck: We couldn't check that you're a person. Please try again in a moment.
  rateLimited: Too many tries from this connection. Please wait a little and try again, or message us on Instagram.
# The calendar invite the visitor receives. {name} and {manageUrl} are filled in by the site.
# Keep personal details (phone, volume, ads) out of the description: the visitor sees it in their calendar.
calendarEvent:
  title: "HiveGen call · {name}"
  description: "Your 15-minute call with HiveGen. Join with the Google Meet link in this invite. To reschedule or cancel: {manageUrl}"
demoNote: "Demo booking: no real call is booked and nothing is sent. The real calendar is not connected on this copy of the site."
