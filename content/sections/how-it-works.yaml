# 04 · How it works
heading: Three steps. No editing on your side.
steps:
  - number: "01"
    title: Book a 15-minute call
    text: Tell us your style and how many videos you need. Your first edit is on us.
  - number: "02"
    title: Send your raw footage
    text: Share a Google Drive, Dropbox or WeTransfer link. No special setup.
  - number: "03"
    title: Get your video in 24–48h
    text: Hook, color, music and branding done. Revisions included.
