#   heading: Same footage. Different result.
#   subline: Drag the handle to compare a raw clip with our finished edit.
#   labels: { before: Raw footage, after: HiveGen edit }
#   slider:
#     before: { source: <path under references/>, start: 0, duration: 5 }
#     after:  { source: <path under references/>, start: 0, duration: 5 }
