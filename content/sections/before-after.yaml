mode: reveal
heading: Same home. Different result.
subline: Watch a daylight shot turn into a twilight hero shot.
labels:
  before: Before · daylight
  after: After · dusk
ariaLabel: Daylight shot of a home cutting to the same home at dusk
reveal:                       # stand-in: a real day-to-dusk cut from portrait video 1
  source: final-videos/Potrait/potrait-video-1.mp4
  start: 31.62
  duration: 2.83
  slowdown: 1.4
  cutAt: 1.5                  # seconds into the prepared clip where the label switches
sample: true
note: Stand-in until the raw clip and its finished edit arrive; then this section becomes a drag slider.
