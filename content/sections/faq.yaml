# 09 · FAQ. Each item is a question (q) and its answer (a).
heading: Questions, answered
items:
  - q: How fast will I get my video?
    a: Usually within 24–48 hours of receiving your footage, depending on how complex the edit is. We confirm the timing before we start.
  # [confirm] style matching
  - q: What do I need to send?
    a: Your raw footage through a Google Drive, Dropbox or WeTransfer link, plus your logo and any brand colors or fonts. If you have a past edit you love, send it too and we'll match the style.
  # [confirm: add "we never contact your clients" if true]
  - q: Is it really white-label?
    a: "Yes. Your videos carry your branding or your client's, never ours: no HiveGen logo and no credits."
  - q: What does Advanced AI add?
    a: Everything in Premium, plus 3D text hooks pinned to the scene, illustrated animations, virtual staging of empty rooms, day-to-dusk and sky replacement, renovation previews and animated maps. We label AI-enhanced shots so your listings stay within MLS rules.
  - q: How does the free first edit work?
    a: Book a call, send footage from one listing, and we edit it free. It comes back with a small HiveGen watermark. If you want to use it, pay the normal price and we remove the watermark.
  # [confirm single-edit revisions]
  - q: How many revisions do I get?
    a: One per video on Basic, two on Premium and Advanced AI. Single edits include one revision.
  - q: Can I order just one video?
    a: Yes. Single edits start at $90, depending on complexity. Monthly plans bring the price down to as little as $60 per video.
  - q: What happens on the call?
    a: Fifteen minutes. We look at your listings, agree on a style and your volume, and set up your free first edit. No pressure.
